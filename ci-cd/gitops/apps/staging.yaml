# Staging — auto-sync, no self-heal (allows QA manual tweaks)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ecommerce-api-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/gitops-repo
    targetRevision: HEAD
    path: helm/ecommerce-api
    helm:
      valueFiles:
        - values.yaml
        - envs/staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: ecommerce-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
