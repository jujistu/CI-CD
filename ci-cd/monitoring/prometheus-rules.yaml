# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ecommerce-api-alerts
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: ecommerce-api
      rules:
        - alert: HighErrorRate
          expr: |
            rate(http_requests_total{app="ecommerce-api", status=~"5.."}[5m])
            / rate(http_requests_total{app="ecommerce-api"}[5m]) > 0.05
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "High HTTP 5xx error rate on ecommerce-api"
            description: "Error rate is {{ $value | humanizePercentage }} over the last 5 minutes."

        - alert: PodCrashLooping
          expr: |
            rate(kube_pod_container_status_restarts_total{
              namespace=~"ecommerce-.*"
            }[15m]) * 60 * 15 > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.pod }} is crash-looping"
            description: "Container {{ $labels.container }} restarted more than 3 times in 15 minutes."

        - alert: HighMemoryUsage
          expr: |
            container_memory_working_set_bytes{
              namespace=~"ecommerce-.*",
              container="ecommerce-api"
            } / container_spec_memory_limit_bytes > 0.85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage on {{ $labels.pod }}"
