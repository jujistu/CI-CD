replicaCount: 3
image:
  tag: "production-latest"
ingress:
  host: api.example.com
  tls:
    - secretName: api-tls
      hosts:
        - api.example.com
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
resources:
  requests:
    cpu: 200m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi
env:
  NODE_ENV: production
