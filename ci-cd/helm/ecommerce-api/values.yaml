# Default values — overridden per environment in envs/
replicaCount: 2

# AWS — overridden per environment
appDomain: "" # e.g. api.yourdomain.com
acmCertificateArn: "" # arn:aws:acm:<region>:<account>:certificate/<id>
awsRegion: "" # e.g. us-east-1
ecrRegistry: "" # <account>.dkr.ecr.<region>.amazonaws.com

image:
  repository: "" # set per env: <ecrRegistry>/ecommerce-api
  pullPolicy: Always
  tag: "sha-latest" # CI updates this field per environment

service:
  type: ClusterIP
  port: 80
  targetPort: 3001

ingress:
  enabled: true
  className: alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: "[{\"HTTPS\":443},{\"HTTP\":80}]"
    alb.ingress.kubernetes.io/ssl-redirect: "443"
  tls: []

namespace: ecommerce-production

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Probes — tuned for NestJS startup time
livenessProbe:
  httpGet:
    path: /api/v1/health
    port: 3001
  initialDelaySeconds: 20
  periodSeconds: 15
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/v1/health
    port: 3001
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

startupProbe:
  httpGet:
    path: /health
    port: 3001
  failureThreshold: 30
  periodSeconds: 10

topologySpread:
  enabled: true

# Rolling update — zero downtime
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

# Sensitive env vars injected from Kubernetes Secret
# Secrets: DATABASE_URL, JWT_SECRET, JWT_REFRESH_SECRET, STRIPE_SECRET_KEY
envFromSecret: ecommerce-api-secret

# Non-sensitive env vars → ConfigMap
env:
  NODE_ENV: production
  PORT: "3001"
  JWT_EXPIRES_IN: "900"
  ALLOWED_ORIGINS: "" # set per env: https://yourdomain.com

serviceAccount:
  create: true
  name: ecommerce-api

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "3001"
  prometheus.io/path: "/metrics"
